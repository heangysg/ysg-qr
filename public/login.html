<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ចូលប្រើប្រាស់ប្រព័ន្ធ Admin | YSG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <style>
        body, input, button {
            font-family: 'Battambang', cursive, 'Plus Jakarta Sans', sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--text-main);
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-dim);
            transition: var(--transition-fast);
            padding: 0.25rem;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-card login-card">
            <div class="login-header">
                <img src="img/Y S G_ (2).png" alt="YSG Logo" style="height: 60px; margin: 0 auto 1.25rem; display: block; filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));" />
                <h1 class="login-title">ចូលប្រើប្រាស់ប្រព័ន្ធ Admin</h1>
                <p class="login-subtitle">សូមបញ្ចូលឈ្មោះអ្នកប្រើប្រាស់ និងពាក្យសម្ងាត់ដើម្បីគ្រប់គ្រង</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="username">ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" class="form-input" placeholder="បញ្ចូលឈ្មោះអ្នកប្រើប្រាស់" required autocomplete="username" />
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">ពាក្យសម្ងាត់ (Password)</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
                        <i class="fas fa-lock input-icon"></i>
                        <span class="toggle-password" id="toggle-btn" title="បង្ហាញ/លាក់ ពាក្យសម្ងាត់">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div id="error-alert" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-text">ឈ្មោះអ្នកប្រើប្រាស់ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។</span>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-primary btn-full" style="margin-top: 1.5rem;">
                    <i class="fas fa-sign-in-alt"></i>
                    <span id="btn-text">ចូលប្រព័ន្ធ (Sign In)</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        function checkAuthIfLoggedIn() {
            fetch('/check-admin-auth')
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        window.location.replace('/index.html');
                    }
                })
                .catch(() => {});
        }

        document.addEventListener('DOMContentLoaded', checkAuthIfLoggedIn);
        window.addEventListener('pageshow', function(event) {
            checkAuthIfLoggedIn();
        });

        const toggleBtn = document.getElementById('toggle-btn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('error-alert');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = 'កំពុងផ្ទៀងផ្ទាត់...';

            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect') || '/index.html';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, redirect }),
                });

                const data = await response.json();

                if (data.success) {
                    window.location.replace(data.redirectUrl);
                } else {
                    errorText.textContent = data.message || 'ឈ្មោះអ្នកប្រើប្រាស់ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។';
                    errorAlert.style.display = 'flex';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorText.textContent = 'មានបញ្ហាបណ្តាញ! សូមព្យាយាមម្តងទៀត។';
                errorAlert.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'ចូលប្រព័ន្ធ (Sign In)';
            }
        });
    </script>
</body>
</html>

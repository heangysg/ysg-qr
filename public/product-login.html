<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ផ្ទៀងផ្ទាត់បង្កាន់ដៃ | YSG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <style>
        body, input, button {
            font-family: 'Battambang', cursive, 'Plus Jakarta Sans', sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .customer-badge {
            margin-top: 0.5rem;
            display: inline-block;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-dim);
            transition: var(--transition-fast);
            padding: 0.25rem;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="glass-card login-card">
            <div class="login-header">
                <img src="img/Y S G_ (2).png" alt="YSG Logo" style="height: 60px; margin: 0 auto 1.25rem; display: block; filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.3));" />
                <h1 class="login-title">ផ្ទៀងផ្ទាត់បង្កាន់ដៃឌីជីថល</h1>
                <p class="login-subtitle" style="color: var(--text-muted); font-size: 0.85rem;">សូមបញ្ចូលលេខកូដសុវត្ថិភាពដើម្បីមើលព័ត៌មានលម្អិត</p>
                <div id="customer-id-badge" class="customer-badge" style="display: none;">
                    <span class="badge badge-success"><i class="fas fa-hashtag"></i> លេខសម្គាល់: <span id="display-customer-id"></span></span>
                </div>
            </div>

            <form id="product-login-form">
                <div class="form-group">
                    <label class="form-label" for="product-password">ពាក្យសម្ងាត់សុវត្ថិភាពបង្កាន់ដៃ</label>
                    <div class="input-wrapper">
                        <input type="password" id="product-password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
                        <i class="fas fa-key input-icon"></i>
                        <span class="toggle-password" id="toggle-btn" title="បង្ហាញ/លាក់ ពាក្យសម្ងាត់">
                            <i id="eye-icon" class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>

                <div id="error-alert" class="alert alert-danger" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="error-text">ពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។</span>
                </div>

                <button type="submit" id="submit-btn" class="btn btn-secondary btn-full" style="margin-top: 1.5rem;">
                    <i class="fas fa-unlock"></i>
                    <span id="btn-text">ចូលមើលបង្កាន់ដៃ (Access Receipt)</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('customerId');
        const badgeContainer = document.getElementById('customer-id-badge');
        const displayCustomerId = document.getElementById('display-customer-id');

        if (customerId) {
            displayCustomerId.textContent = customerId;
            badgeContainer.style.display = 'inline-block';
        }

        const toggleBtn = document.getElementById('toggle-btn');
        const passwordInput = document.getElementById('product-password');
        const eyeIcon = document.getElementById('eye-icon');

        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        });

        document.getElementById('product-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = passwordInput.value;
            const errorAlert = document.getElementById('error-alert');
            const errorText = document.getElementById('error-text');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');

            if (!customerId) {
                errorText.textContent = 'រកមិនឃើញ ID អតិថិជននៅក្នុង URL ទេ។';
                errorAlert.style.display = 'flex';
                return;
            }

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            btnText.textContent = 'កំពុងផ្ទៀងផ្ទាត់...';

            try {
                const response = await fetch('/product-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password, customerId }),
                });

                const data = await response.json();

                if (data.success) {
                    window.location.replace(data.redirectUrl);
                } else {
                    errorText.textContent = data.message || 'ពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។';
                    errorAlert.style.display = 'flex';
                }
            } catch (error) {
                console.error('Product login error:', error);
                errorText.textContent = 'មានបញ្ហាបណ្តាញ! សូមព្យាយាមម្តងទៀត។';
                errorAlert.style.display = 'flex';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'ចូលមើលបង្កាន់ដៃ (Access Receipt)';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ព័ត៌មានបង្កាន់ដៃ | YSG Digital Receipt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <style>
        body, input, button, table, th, td {
            font-family: 'Battambang', cursive, 'Plus Jakarta Sans', sans-serif;
        }

        .receipt-card-wrapper {
            max-width: 580px;
            margin: 3rem auto;
            padding: 0 1.5rem;
        }

        .receipt-card {
            padding: 2.25rem;
            position: relative;
        }

        .receipt-header {
            text-align: center;
            border-bottom: 1px dashed var(--panel-border);
            padding-bottom: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .company-logo-img {
            height: 65px;
            margin-bottom: 0.75rem;
        }

        .verified-badge {
            margin-top: 0.75rem;
        }

        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .receipt-table th {
            text-align: left;
            padding: 0.75rem 0.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            width: 40%;
        }

        .receipt-table td {
            text-align: right;
            padding: 0.75rem 0.5rem;
            color: var(--text-main);
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header class="app-header">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <img src="img/Y S G_ (2).png" alt="YSG Logo" style="height: 48px;" />
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link"><i class="fas fa-plus-circle"></i> <span>បង្កើត QR Code</span></a></li>
                <li><a href="admin.html" class="nav-link"><i class="fas fa-tachometer-alt"></i> <span>អ្នកគ្រប់គ្រង</span></a></li>
                <li><a href="contact.html" class="nav-link"><i class="fas fa-envelope"></i> <span>ទំនាក់ទំនង</span></a></li>
                <li><button id="logout-btn-nav" class="btn btn-outline btn-sm"><i class="fas fa-sign-out-alt"></i> <span>ចាកចេញ</span></button></li>
            </ul>
        </div>
    </header>

    <!-- Receipt Display Container -->
    <main class="receipt-card-wrapper">
        <div id="product-detail-content" class="glass-card receipt-card" style="display: none;">
            
            <div class="receipt-header">
                <img src="img/Y S G_ (2).png" alt="YSG Logo" class="company-logo-img" />
                <h1 style="font-size: 1.4rem; font-weight: 800;">Yeung Shi Group Co.,Ltd</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Phnom Penh, Cambodia</p>
                
                <div class="verified-badge">
                    <span class="badge badge-success"><i class="fas fa-check-circle"></i> ផ្ទៀងផ្ទាត់ភាពត្រឹមត្រូវរួចរាល់</span>
                </div>
            </div>

            <table id="receipt-table" class="receipt-table">
                <tr>
                    <th>ID អតិថិជន</th>
                    <td id="customer-id" style="font-weight: 700; color: var(--primary);"></td>
                </tr>
                <tr>
                    <th>ឈ្មោះអតិថិជន</th>
                    <td id="customer-name"></td>
                </tr>
                <tr>
                    <th>លេខទូរស័ព្ទ</th>
                    <td id="phone-number"></td>
                </tr>
                <tr>
                    <th>ទីតាំង</th>
                    <td id="location"></td>
                </tr>
                <tr>
                    <th>ឈ្មោះផលិតផល</th>
                    <td id="machine-name"></td>
                </tr>
                <tr>
                    <th>កាលបរិច្ឆេទទិញ</th>
                    <td id="purchase-date"></td>
                </tr>
            </table>

            <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-primary btn-full" onclick="window.print()">
                    <i class="fas fa-print"></i> បោះពុម្ពបង្កាន់ដៃ
                </button>
                <button class="btn btn-outline btn-full" onclick="goBack()">
                    <i class="fas fa-arrow-left"></i> ត្រឡប់ទៅទំព័រដើម
                </button>
            </div>

            <p id="no-data-message" class="alert alert-danger" style="display: none; margin-top: 1.5rem; justify-content: center;">
                <i class="fas fa-exclamation-triangle"></i> រកមិនឃើញទិន្នន័យបង្កាន់ដៃសម្រាប់លេខសម្គាល់អតិថិជននេះទេ។
            </p>
        </div>
    </main>

    <!-- Alert Modal -->
    <div id="messageBox" class="modal-overlay">
        <div class="modal-container" style="max-width: 400px; text-align: center;">
            <div id="messageIcon" style="font-size: 3rem; margin-bottom: 1rem;"></div>
            <p id="messageText" style="font-size: 1rem; margin-bottom: 1.25rem;"></p>
            <button type="button" id="btn-prod-ok" class="btn btn-primary btn-sm" style="cursor: pointer;">យល់ព្រម (OK)</button>
        </div>
    </div>

    <script>
        window.hideMessageBox = function() {
            const messageBox = document.getElementById('messageBox');
            if (messageBox) messageBox.classList.remove('active');
        };

        function hideMessageBox() {
            window.hideMessageBox();
        }

        function showMessageBox(message, type) {
            const messageBox = document.getElementById('messageBox');
            const messageIcon = document.getElementById('messageIcon');
            const messageText = document.getElementById('messageText');

            messageText.textContent = message;
            if (type === 'success') {
                messageIcon.className = 'fas fa-check-circle';
                messageIcon.style.color = 'var(--secondary)';
            } else {
                messageIcon.className = 'fas fa-times-circle';
                messageIcon.style.color = 'var(--danger)';
            }
            messageBox.classList.add('active');
        }

        function goBack() {
            fetch('/product-logout', { method: 'POST' })
                .then(() => { window.location.replace("index.html"); })
                .catch(() => { window.location.replace("index.html"); });
        }

        function formatDate(dateString) {
            if (!dateString) return "-";
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return "-";
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const customerId = urlParams.get("customerId");

            if (!customerId) {
                document.getElementById("no-data-message").style.display = "flex";
                document.getElementById("receipt-table").style.display = "none";
                document.getElementById("product-detail-content").style.display = 'block';
                return;
            }

            fetch('/check-product-auth')
                .then(res => res.json())
                .then(data => {
                    if (data.authenticated) {
                        fetch(`/api/receipts/by-id/${encodeURIComponent(customerId)}`)
                            .then(res => {
                                if (!res.ok) {
                                    if (res.status === 401) {
                                        window.location.replace(`/product-login.html?customerId=${encodeURIComponent(customerId)}`);
                                        return;
                                    }
                                    throw new Error("រកមិនឃើញបង្កាន់ដៃទេ។");
                                }
                                return res.json();
                            })
                            .then(data => {
                                document.getElementById("customer-id").textContent = data.customerId;
                                document.getElementById("customer-name").textContent = data.customerName;
                                document.getElementById("phone-number").innerHTML = data.phoneNumber ? data.phoneNumber.replace(/\s*\/\s*/, '/<br>') : '';
                                document.getElementById("location").textContent = data.location || "-";
                                document.getElementById("machine-name").textContent = data.machineName;
                                document.getElementById("purchase-date").textContent = formatDate(data.purchaseDate);

                                document.getElementById("product-detail-content").style.display = 'block';
                                document.getElementById("receipt-table").style.display = "table";
                                document.getElementById("no-data-message").style.display = "none";
                            })
                            .catch(err => {
                                console.error(err);
                                document.getElementById("no-data-message").style.display = "flex";
                                document.getElementById("receipt-table").style.display = "none";
                                document.getElementById("product-detail-content").style.display = 'block';
                                showMessageBox(err.message || "បរាជ័យក្នុងការផ្ទុកទិន្នន័យបង្កាន់ដៃ។", "error");
                            });
                    } else {
                        window.location.replace(`/product-login.html?customerId=${encodeURIComponent(customerId)}`);
                    }
                })
                .catch(() => {
                    window.location.replace(`/product-login.html?customerId=${encodeURIComponent(customerId)}`);
                });

            const btnProdOk = document.getElementById('btn-prod-ok');
            if (btnProdOk) {
                btnProdOk.addEventListener('click', function(e) {
                    if (e) e.stopPropagation();
                    window.hideMessageBox();
                });
            }

            const logoutButtonNav = document.getElementById('logout-btn-nav');
            if (logoutButtonNav) {
                logoutButtonNav.addEventListener('click', () => {
                    fetch('/logout', { method: 'POST' }).then(() => { window.location.replace('/login.html'); });
                });
            }

            window.addEventListener('click', function(event) {
                const msgBox = document.getElementById('messageBox');
                if (event.target === msgBox) window.hideMessageBox();
            });
        });
    </script>
</body>

</html>
